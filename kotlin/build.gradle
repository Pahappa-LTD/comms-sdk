import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'org.jetbrains.kotlin.jvm' version "1.9.0"
    id 'application'
    id 'java-library'
    id 'maven-publish'
    id 'org.jreleaser' version '1.26.0'
}

group = "com.pahappa.systems"
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        url = 'https://central.sonatype.com/repository/maven-snapshots/'
        mavenContent { snapshotsOnly() }
    }
    maven {
        url = 'https://maven.pkg.github.com/pahappa-ltd/packages/'
        mavenContent { snapshotsOnly() }
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

dependencies {
    implementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.0")
    implementation("org.springframework:spring-web:5.3.31")
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.5")
    implementation("com.fasterxml.jackson.core:jackson-core:2.13.5")
    implementation("com.fasterxml.jackson.core:jackson-databind:2.13.5")

    testImplementation("org.jetbrains.kotlin:kotlin-test:1.9.0")
    testImplementation("org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3")
    testImplementation("com.pahappa.systems:comms-kotlin-sdk:1.1.0")
}

application {
    mainClass = 'CommsSDK'
}

tasks.withType(KotlinCompile).configureEach {
    kotlinOptions.jvmTarget = "1.8"
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = group
            artifactId = 'comms-kotlin-sdk'
            version = version

            from components.java

            pom {
                name = "Comms Kotlin SDK v$version"
                description = "Comms SDK for Kotlin"
                url = "https://github.com/Pahappa-LTD/comms-sdk"
                inceptionYear = '2024'

                licenses {
                    license {
                        name = "MIT"
                        url = "https://opensource.org/licenses/MIT"
                    }
                }
                developers {
                    developer {
                        id = "daniel"
                        name = "Daniel"
                        email = "daniel@ug.pahappa.com"
                    }
                }
                scm {
                    connection = "scm:git:https://github.com/Pahappa-LTD/comms-kotlin-sdk.git"
                    developerConnection = "scm:git:ssh://git@github.com/Pahappa-LTD/comms-kotlin-sdk.git"
                    url = "https://github.com/Pahappa-LTD/comms-kotlin-sdk"
                }
            }
        }
    }

    repositories {
        maven {
            // JReleaser stages here first, then uploads to Central itself
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

var gpgApp = project.findProperty("gpg.executable")
var gpgKey = project.findProperty("gpg.keyName")
var gpgPass = project.findProperty("gpg.passphrase")
var mvnUser = project.findProperty("mavenCentral.username")
var mvnPass = project.findProperty("mavenCentral.password")

jreleaser {
    release {
        generic {
            enabled = false
        }
    }
    signing {
        pgp {
            active = 'ALWAYS'
            armored = true
            mode = 'COMMAND'
            command {
//                print("Key: $gpgKey\n")
//                print("Pass: $gpgPass\n")
                executable = gpgApp
                keyName = gpgKey
                passphrase = gpgPass
            }
        }
    }
    deploy {
        maven {
            mavenCentral {
                sonatype {
                    active = 'ALWAYS'
                    url = 'https://central.sonatype.com/api/v1/publisher'
                    stagingRepository('build/staging-deploy')
                    username = mvnUser
                    password = mvnPass
                }
            }
        }
    }
}
